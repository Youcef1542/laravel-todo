name: CI/CD Laravel ToDo

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Cloner le dépôt
        uses: actions/checkout@v3

      - name: Se connecter à Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire l'image Docker CORRECTE (Laravel complet)
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/laravel-todo:latest -f docker/app/Dockerfile .

      - name: Pusher l'image vers Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/laravel-todo:latest
